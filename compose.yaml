services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: easy_quote_local
      POSTGRES_USER: easy_quote
      POSTGRES_PASSWORD: easy_quote_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - easy-quote-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy_quote -d easy_quote_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  easy-quote-postgres:
