services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: easy_quote_fictional
      POSTGRES_USER: easy_quote
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - fictional-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy_quote -d easy_quote_fictional"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fictional-postgres:
